<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Townsville Bushwalking Club - Events Calendar</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .calendar-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .calendar-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-nav {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .current-month {
            font-size: 2rem;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #f0f0f0;
        }

        .calendar-day-header {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #666;
            font-size: 0.9rem;
        }

        .calendar-day {
            background: white;
            min-height: 120px;
            padding: 10px;
            position: relative;
            transition: all 0.3s ease;
        }

        .calendar-day:hover {
            background: #f8f9fa;
        }

        .calendar-day.today {
            background: #e3f2fd;
            border: 2px solid #2196f3;
        }

        .calendar-day.other-month {
            background: #fafafa;
            color: #ccc;
        }

        .day-number {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .event-indicator {
            width: 8px;
            height: 8px;
            background: #ff6b6b;
            border-radius: 50%;
            margin: 2px 0;
        }

        .events-list {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .events-title {
            font-size: 2rem;
            color: #333;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .event-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .event-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .event-date {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-time {
            color: #666;
            margin-bottom: 15px;
        }

        .event-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .event-location {
            color: #888;
            font-style: italic;
        }

        .event-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .no-events {
            text-align: center;
            padding: 50px;
            color: #666;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .calendar-header {
                flex-direction: column;
                gap: 20px;
            }
            
            .calendar-nav {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .current-month {
                font-size: 1.5rem;
            }
            
            .calendar-day {
                min-height: 80px;
                padding: 5px;
            }
            
            .event-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-mountain"></i> Townsville Bushwalking Club</h1>
            <p>Events Calendar & Activities</p>
        </div>

        <div class="calendar-container">
            <div class="calendar-header">
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="previousMonth()">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="nav-btn" onclick="goToToday()">Today</button>
                    <button class="nav-btn" onclick="nextMonth()">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <div class="current-month" id="currentMonth"></div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="events-list">
            <div class="events-header">
                <h2 class="events-title">Events for <span id="eventsMonth"></span></h2>
                <button class="refresh-btn" onclick="loadEvents()">
                    <i class="fas fa-sync-alt"></i> Refresh Events
                </button>
            </div>
            <div id="eventsContainer">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading events...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = [];

        // Initialize the calendar
        document.addEventListener('DOMContentLoaded', function() {
            renderCalendar();
            loadEvents();
        });

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Update header
            document.getElementById('currentMonth').textContent = 
                new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            document.getElementById('eventsMonth').textContent = 
                new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            // Create calendar grid
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Add day headers
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            days.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                grid.appendChild(dayHeader);
            });

            // Add calendar days
            const today = new Date();
            for (let i = 0; i < 42; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                if (date.getMonth() !== month) {
                    dayElement.classList.add('other-month');
                }
                
                if (date.toDateString() === today.toDateString()) {
                    dayElement.classList.add('today');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = date.getDate();
                dayElement.appendChild(dayNumber);

                // Add event indicators
                const dayEvents = getEventsForDate(date);
                dayEvents.forEach(event => {
                    const indicator = document.createElement('div');
                    indicator.className = 'event-indicator';
                    indicator.title = event.name;
                    dayElement.appendChild(indicator);
                });

                grid.appendChild(dayElement);
            }
        }

        function getEventsForDate(date) {
            return events.filter(event => {
                const eventDate = new Date(event.start_time);
                return eventDate.toDateString() === date.toDateString();
            });
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
            loadEvents();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
            loadEvents();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
            loadEvents();
        }

        async function loadEvents() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading events...</p></div>';

            try {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                
                const response = await fetch(`/api/events/${year}/${month}`);
                const data = await response.json();

                if (data.success) {
                    events = data.data;
                    displayEvents(events);
                } else {
                    throw new Error(data.error || 'Failed to load events');
                }
            } catch (error) {
                console.error('Error loading events:', error);
                container.innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading events: ${error.message}</p>
                        <p>Please check your Facebook access token and try again.</p>
                    </div>
                `;
            }
        }

        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="no-events">
                        <i class="fas fa-calendar-times"></i>
                        <p>No events scheduled for this month</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = events.map(event => `
                <div class="event-card">
                    <div class="event-title">${event.name}</div>
                    <div class="event-date">${event.formatted_date}</div>
                    <div class="event-time">
                        <i class="fas fa-clock"></i> ${event.formatted_time}
                        ${event.formatted_end_time ? ` - ${event.formatted_end_time}` : ''}
                    </div>
                    ${event.description ? `<div class="event-description">${event.description.substring(0, 200)}${event.description.length > 200 ? '...' : ''}</div>` : ''}
                    ${event.place ? `<div class="event-location"><i class="fas fa-map-marker-alt"></i> ${event.place.name || 'Location TBA'}</div>` : ''}
                    <div class="event-stats">
                        <span><i class="fas fa-users"></i> ${event.attending_count} attending</span>
                        <span><i class="fas fa-heart"></i> ${event.interested_count} interested</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
