name: Sync Event Covers

on:
    schedule:
        - cron: '0 16 * * *' # 2am AEST (UTC+10) daily
    workflow_dispatch: # allow manual runs from the Actions tab

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: ppnpm install --frozen-lockfile

            - name: Download new covers
              run: pnpm exec tsx tools/sync-covers.ts
              env:
                  FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
                  FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

            - name: Regenerate cover manifest
              run: pnpm run covers:manifest

            - name: Commit and push if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/event-covers/ data/event-cover-manifest.json data/cover-sources.json
                  if git diff --staged --quiet; then
                    echo "No new covers - nothing to commit"
                  else
                    git commit -m "chore: sync event covers"
                    git push
                  fi
