name: Send Monthly Events Poster

on:
    schedule:
        # 15:30 UTC on month-end days = 01:30 Brisbane on the 1st - after sync-month
        - cron: '30 15 28-31 * *'
    workflow_dispatch:

jobs:
    send-poster:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Should run poster
              id: should_run
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "run=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  BRISBANE_DAY=$(TZ=Australia/Brisbane date +%d)
                  BRISBANE_HOUR=$(TZ=Australia/Brisbane date +%H)
                  BRISBANE_MIN=$(TZ=Australia/Brisbane date +%M)
                  if [ "$BRISBANE_DAY" = "01" ] && [ "$BRISBANE_HOUR" = "01" ] && [ "$BRISBANE_MIN" = "30" ]; then
                    echo "run=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "run=false" >> "$GITHUB_OUTPUT"
                    echo "Not 01:30 on the 1st in Brisbane - skipping scheduled run"
                  fi

            - name: Generate poster PDF and email
              if: steps.should_run.outputs.run == 'true'
              run: npm run poster:send
              env:
                  POSTER_SITE_URL: https://events.townsvillebushwalkingclub.com
                  POSTER_MAIL_TO: ${{ secrets.POSTER_MAIL_TO }}
                  POSTER_MAIL_FROM: ${{ secrets.POSTER_MAIL_FROM }}
                  POSTER_MAIL_SMTP_HOST: ${{ secrets.POSTER_MAIL_SMTP_HOST }}
                  POSTER_MAIL_SMTP_PORT: ${{ secrets.POSTER_MAIL_SMTP_PORT }}
                  POSTER_MAIL_SMTP_USER: ${{ secrets.POSTER_MAIL_SMTP_USER }}
                  POSTER_MAIL_SMTP_PASSWORD: ${{ secrets.POSTER_MAIL_SMTP_PASSWORD }}
                  POSTER_MAIL_SMTP_SECURE: ${{ secrets.POSTER_MAIL_SMTP_SECURE }}
                  POSTER_MAIL_CC: ${{ secrets.POSTER_MAIL_CC }}
