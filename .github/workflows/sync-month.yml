name: Archive Previous Month

on:
  schedule:
    - cron: '0 16 1 * *'  # 2am AEST (UTC+10) on the 1st of every month
  workflow_dispatch:       # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Archive previous month events and covers
        run: npx tsx tools/sync-month.ts
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

      - name: Regenerate cover manifest
        run: npm run covers:manifest

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events/ public/event-covers/ data/event-cover-manifest.json data/cover-sources.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: archive $(date -u +'%B %Y' -d '1 month ago') events [skip ci]"
            git push
          fi
